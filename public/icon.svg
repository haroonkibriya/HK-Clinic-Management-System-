<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe-zone -->
  <rect width="512" height="512" rx="112" fill="url(#medGrad)"/>
  
  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Medical Cross Badge -->
  <g transform="translate(256, 230)">
    <!-- Shadow -->
    <path d="M-40,-130 h80 v90 h90 v80 h-90 v90 h-80 v-90 h-90 v-80 h90 z" fill="rgba(0,0,0,0.12)" transform="translate(0, 8)"/>
    <!-- Medical Cross -->
    <path d="M-40,-130 h80 v90 h90 v80 h-90 v90 h-80 v-90 h-90 v-80 h90 z" fill="url(#crossGrad)" rx="16"/>
    <!-- Central Stethoscope / Pulse symbol in Teal -->
    <path d="M-60,0 L-25,0 L-10,-35 L12,40 L28,-18 L42,0 L60,0" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography HK Clinic -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">HK CLINIC</text>
  <text x="256" y="475" font-family="'Noto Nastaliq Urdu', system-ui, sans-serif" font-size="20" font-weight="600" fill="#99f6e4" text-anchor="middle">ایچ کے کلینک</text>
</svg>
